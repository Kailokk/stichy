[package]
name = "stitchy"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "stitchy"
path = "src/main.rs"
test = false
doctest = false
bench = false

[dependencies]
# Embassy
embassy-executor = { version = "0.9.1", features = [
  "arch-cortex-m",
  "executor-thread",
  "defmt",
] }
embassy-embedded-hal = { version = "0.5.0", features = ["defmt"] }
embassy-sync = "0.7.2"
embassy-time = { version = "0.5.0", features = ["defmt"] }
embassy-rp = { version = "0.8.0", features = [
  "defmt",
  "time-driver",
  "critical-section-impl",
  "rp235xa",
  "binary-info",
] }
embassy-futures = "0.1.2"
futures = { version = "0.3.30", default-features = false, features = [
  "async-await",
] }

# Arm
cortex-m = "0.7.6"
cortex-m-rt = "0.7.0"

# Debug
panic-probe = { version = "1.0", features = ["print-defmt"] }
defmt = "1.0.1"
defmt-rtt = "1.1.0"
thiserror = {version = "2.0.17", default-features = false}

# Serialization
serde = { version = "1.0.228", default-features = false }
postcard = {version = "1.1.3", features = ["heapless", "defmt", "use-defmt"]}
heapless = {version = "0.7.0", features = ["serde"]}