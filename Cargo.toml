[package]
name = "stitchy"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "stitchy"
path = "src/main.rs"
test = false
doctest = false
bench = false

[dependencies]
cortex-m = "0.7.6"
cortex-m-rt = "0.7.0"

embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "dc18ee2", features = ["arch-cortex-m", "executor-thread", "defmt", "integrated-timers"] }
panic-probe = { version = "1.0", features = ["print-defmt"] }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "dc18ee2" }
embassy-rp = { git = "https://github.com/embassy-rs/embassy", rev = "dc18ee2", features = [
  "defmt",
  "time-driver",
  "critical-section-impl",
  "rp235xa",
  "binary-info",
] }
defmt = "1.0.1"
embassy-sync = "0.7.2"
defmt-rtt = "1.1.0"
futures = { version = "0.3.30", default-features = false, features = [
    "async-await",
] }